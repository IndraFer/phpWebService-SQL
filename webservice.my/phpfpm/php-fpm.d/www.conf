[www]

; User and group that run the PHP-FPM processes
user = www-data
group = www-data

; Socket or TCP port used by PHP-FPM
; PORT MODE (default): Nginx reaches PHP-FPM via the service name (phpfpm:9000)
; SOCKET MODE: switch to `listen = /var/run/php/php-fpm.sock` and uncomment
;              the php_socket mounts in docker-compose.yml (nginx + phpfpm)
; listen = /var/run/php/php-fpm.sock
listen = 9000

; Socket permissions so Nginx can access it (only applies to the unix socket)
; listen.owner = www-data
; listen.group = www-data
; listen.mode = 0660

; Run PHP-FPM with dynamic process mode (adjust as needed)
pm = dynamic

; Max number of PHP-FPM processes running at the same time
; Adjust to the server's RAM and CPU
pm.max_children = 40

; Number of processes started at startup
pm.start_servers = 8

; Minimum number of idle processes (ready to accept requests)
pm.min_spare_servers = 5

; Maximum number of idle processes
pm.max_spare_servers = 20

; Limit requests per process to prevent memory leaks
pm.max_requests = 500

; FPM status monitoring path (optional, for monitoring)
pm.status_path = /status

; Error and slow log logging
catch_workers_output = yes
php_flag[display_errors] = off

; Slow log file path and slow request timeout (optional)
slowlog = /var/log/php-fpm/www-slow.log
request_slowlog_timeout = 5s

; Environment variables required by PHP
env[HOSTNAME] = $HOSTNAME
env[TMP] = /tmp

; Disable potentially dangerous PHP functions (add more as needed)
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; Security: restrict chroot access (enable and adjust for stronger isolation)
; chroot = /var/www/html

; Security: restrict open_basedir access (limit PHP file access)
; php_admin_value[open_basedir] = /var/www/html:/tmp

; Set error log level (optional)
php_admin_value[error_log] = /var/log/php-fpm/www-error.log
php_admin_flag[log_errors] = on
