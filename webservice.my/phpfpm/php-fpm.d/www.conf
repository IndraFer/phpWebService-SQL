[www]

; User dan group yang menjalankan proses PHP-FPM
user = www-data
group = www-data

; Socket atau TCP port yang digunakan PHP-FPM
; Gunakan socket UNIX untuk performa lebih baik dan keamanan
listen = /var/run/php/php-fpm.sock
;listen = 9000

; Permissions untuk socket agar Nginx bisa akses
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Jalankan PHP-FPM dengan mode proses dinamis (sesuaikan kebutuhan)
pm = dynamic

; Maksimal proses PHP-FPM yang berjalan bersamaan
; Sesuaikan dengan RAM dan CPU server
pm.max_children = 40

; Jumlah proses yang dijalankan saat start
pm.start_servers = 8

; Jumlah proses minimum yang idle (siap menerima request)
pm.min_spare_servers = 5

; Jumlah proses maksimum yang idle
pm.max_spare_servers = 20

; Batasi jumlah request per proses untuk mencegah memory leak
pm.max_requests = 500

; Path untuk monitoring status FPM (opsional, untuk monitoring)
pm.status_path = /status

; Logging error dan slow log
catch_workers_output = yes
php_flag[display_errors] = off

; Path file slow log dan batas waktu slow request (opsional)
slowlog = /var/log/php-fpm/www-slow.log
request_slowlog_timeout = 5s

; Environment variables yang dibutuhkan PHP
env[HOSTNAME] = $HOSTNAME
env[TMP] = /tmp

; Disable PHP functions yang berpotensi berbahaya (tambahkan sesuai kebutuhan)
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; Security: batasi akses chroot (jika ingin lebih aman, aktifkan dan sesuaikan)
; chroot = /var/www/html

; Security: batasi akses open_basedir (batasi akses file PHP)
; php_admin_value[open_basedir] = /var/www/html:/tmp

; Set error log level (opsional)
php_admin_value[error_log] = /var/log/php-fpm/www-error.log
php_admin_flag[log_errors] = on
