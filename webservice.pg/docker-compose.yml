services:
  postgres:
    image: postgres:latest
    container_name: postgres_db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:latest
    container_name: redis_db
    command: redis-server --appendonly yes
    # To enable Redis authentication, add REDIS_PASSWORD to .env, then uncomment the line below:
    # command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      # If authentication is enabled, use: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ssl_certs:/etc/nginx/ssl:ro
      - ./phpapp:/var/www/html               # Make sure the root matches the nginx configuration
      # - php_socket:/var/run/php            # SOCKET MODE only: uncomment for unix socket.
                                             #   Not needed in PORT MODE (default: fastcgi_pass phpfpm:9000)
    depends_on:
      - phpfpm
      - pgadmin
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  phpfpm:
    build:
      context: .
      dockerfile: dockerfile-phpfpm
    container_name: phpfpm
    env_file:
      - .env
    volumes:
      - ./phpapp:/var/www/html
      - ssl_certs:/etc/nginx/ssl
      - ./phpfpm/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      # - php_socket:/var/run/php            # SOCKET MODE only: uncomment for unix socket (same as nginx)
    depends_on:
      - postgres
    restart: unless-stopped
    expose:
      - "9000"                             # PORT MODE (default): reachable as phpfpm:9000; not needed in socket mode
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "8081:80"
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  app-network:

volumes:
  postgres_data:
  ssl_certs:
  php_socket:                               # used only in SOCKET MODE (see nginx/phpfpm mounts)
