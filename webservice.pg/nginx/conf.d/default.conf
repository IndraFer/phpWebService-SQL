server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        # SOCKET MODE: use the unix socket instead (also uncomment the php_socket mounts in docker-compose.yml)
        # fastcgi_pass unix:/var/run/php/php-fpm.sock;  # or the php-fpm service name in docker-compose (phpfpm:9000)
        fastcgi_pass phpfpm:9000;                      # PORT MODE (default)
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_buffer_size 128k;          # buffer size for response headers
        fastcgi_buffers 8 256k;            # number and size of buffers for response body
        fastcgi_busy_buffers_size 256k;    # must be >= buffer_size or buffers
        fastcgi_temp_file_write_size 256k; # must be >= buffer_size or buffers
    }

    # pgAdmin is served under the /pgadmin/ prefix; X-Script-Name tells pgAdmin its base URL
    # (keep the prefix intact upstream - do NOT strip it like phpmyadmin)
    location = /pgadmin {
        return 301 /pgadmin/;
    }

    location ^~ /pgadmin/ {
        proxy_pass http://pgadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin;

        proxy_redirect off;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
